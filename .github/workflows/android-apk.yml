name: Android APK

on:
  push:
    branches:
      - android-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build VS Code web bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bash android/scripts/prepare-web.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Assemble APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Code-OSS-Android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code-OSS-Android-APK
          path: dist/Code-OSS-Android-debug.apk
          if-no-files-found: error
